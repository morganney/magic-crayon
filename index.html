<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>magic-crayon</title>
    <style>
      html,
      body {
        margin: 0;
        width: 100%;
        height: 100%;
      }
      #app {
        width: 100%;
        min-height: 100dvh;
        box-sizing: border-box;
        display: flex;
        flex-direction: column;
        gap: 16px;
        padding: 16px;
      }
      .fixture {
        display: flex;
        flex-direction: column;
        gap: 8px;
        min-height: 0;
      }
      .custom-width-controls {
        display: flex;
        gap: 8px;
        flex-wrap: wrap;
        align-items: center;
        font:
          12px/1.2 system-ui,
          sans-serif;
      }
      .custom-width-controls label {
        display: inline-flex;
        gap: 6px;
        align-items: center;
      }
      .custom-width-controls input {
        width: 120px;
      }
    </style>
  </head>
  <body>
    <div id="app">
      <section class="fixture">
        <h2>Built-in width controls</h2>
        <magic-crayon serialization="blob" width-controls="on"></magic-crayon>
      </section>

      <section class="fixture">
        <h2>Custom slotted width controls</h2>
        <magic-crayon
          id="custom-controls-fixture"
          serialization="blob"
          width-controls="on"
        >
          <div slot="width-controls" class="custom-width-controls">
            <label>
              Stroke
              <input
                id="custom-stroke-width"
                type="range"
                min="1"
                max="20"
                step="0.5"
                value="5"
              />
            </label>
            <label>
              Eraser scale
              <input
                id="custom-eraser-scale"
                type="range"
                min="1"
                max="6"
                step="0.1"
                value="1"
              />
            </label>
          </div>
        </magic-crayon>
      </section>
    </div>
    <script type="module">
      const app = document.querySelector('#app')
      const register = async () => {
        const module = import.meta.hot
          ? await import('/src/magic-crayon.ts')
          : await import(
              /* @vite-ignore */ new URL('./magic-crayon.js', import.meta.url).href
            )

        const { MagicCrayon, TAG_NAME } = module

        if (!customElements.get(TAG_NAME)) {
          customElements.define(TAG_NAME, MagicCrayon)
        }

        const customFixture = app?.querySelector('#custom-controls-fixture')
        const strokeInput = app?.querySelector('#custom-stroke-width')
        const eraserInput = app?.querySelector('#custom-eraser-scale')

        if (
          customFixture instanceof MagicCrayon &&
          strokeInput instanceof HTMLInputElement &&
          eraserInput instanceof HTMLInputElement
        ) {
          strokeInput.addEventListener('input', () => {
            customFixture.strokeWidth = Number(strokeInput.value)
          })

          eraserInput.addEventListener('input', () => {
            customFixture.eraserScale = Number(eraserInput.value)
          })

          customFixture.addEventListener('widthchange', event => {
            strokeInput.value = String(event.detail.strokeWidth)
            eraserInput.value = String(event.detail.eraserScale)
          })
        }
      }

      register()
    </script>
  </body>
</html>
