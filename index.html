<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>magic-crayon</title>
    <style>
      html,
      body {
        margin: 0;
        width: 100%;
        height: 100%;
      }
      #app {
        width: 100%;
        height: 100dvh;
        box-sizing: border-box;
      }
    </style>
  </head>
  <body>
    <div id="app"></div>
    <script type="module">
      const app = document.querySelector('#app')

      const mountFixture = async () => {
        const module = import.meta.hot
          ? await import('/src/magic-crayon.ts')
          : await import(
              /* @vite-ignore */ new URL('./magic-crayon.js', import.meta.url).href
            )

        const { MagicCrayon, TAG_NAME } = module

        if (!customElements.get(TAG_NAME)) {
          customElements.define(TAG_NAME, MagicCrayon)
        }

        if (app) {
          app.innerHTML = `<magic-crayon serialization="blob"></magic-crayon>`
        }
      }

      mountFixture()
    </script>
  </body>
</html>
